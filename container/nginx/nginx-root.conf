worker_processes auto;
daemon off;

events {
    worker_connections 1024;
    use epoll;
}

http {
    client_max_body_size 2048M;
    include gzip.conf;
    include mime.types;

    server {
        listen 8080;
        server_name _;

        root /scowport/public;

        location / {
            # some security headers
            # The following CSP can be used for some embeds but not all (like lichess for example)
            # add_header Content-Security-Policy "default-src blob: data: http: https: 'unsafe-inline' 'self';";
            add_header Referrer-policy "same-origin";
            add_header X-Content-Type-Options "nosniff";
            add_header X-XSS-Protection "1; mode=block";
            add_header X-Frame-Options "DENY";

            expires -1;
            try_files $uri /index.html;
        }

        location ~ \.(js|png|css|woff2)$ {
            expires 1M;
            add_header Cache-Control "public";
        }

        location /files/ {
            proxy_pass http://zusam:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox";
            expires 1M;
        }

        location /api/ {
            proxy_pass http://zusam:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
